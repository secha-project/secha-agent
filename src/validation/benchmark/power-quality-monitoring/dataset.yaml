  evaluators: []
- name: task_6
  inputs: Give me all the data you have for device 156 for March 1, 2025 from 12:00
    to 18:00.
  metadata:
    case_id: 3161d9fd-ef2f-414a-9162-922bdfd991df
    query_code: 'SELECT *

      FROM analytics.bronze.power_quality_measurements_electrix

      WHERE device_id = ''device_156''

      AND timestamp >= TIMESTAMP ''2025-03-01T12:00:00Z''

      AND timestamp < TIMESTAMP ''2025-03-01T18:00:00Z'''
    category: data discovery
  expected_output:
  - table_path: artifacts/task_6/table.csv
    ordered: false
  evaluators: []
- name: task_7
  inputs: 'Get me the following power quality data:  frequency, supply voltage magnitude
    across the three phases, voltage unbalances between the phases and total voltage
    distortion across the three phases; from the solar power plants in Marjamaki for
    01.03.2025, 12:00 - 12:05 in ascending order of time.'
  metadata:
    case_id: b61ec73c-4b9a-436c-a4dd-582cc53b644b
    query_code: "SELECT device_name, timestamp, freq, ul1v, ul2v, ul3v, u12v, u23v,\
      \ u31v, tdul1, tdul2, tdul3\nFROM analytics.bronze.power_quality_measurements_procem\n\
      WHERE (\n    device_name == 'MarjamakiSolarPowerPlant01'\n    OR device_name\
      \ == 'MarjamakiSolarPowerPlant02'\n)\nAND timestamp >= TIMESTAMP '2025-03-01T12:00:00'\n\
      AND timestamp < TIMESTAMP '2025-03-01T12:05:00'\nORDER BY timestamp"
    category: data discovery
  expected_output:
  - table_path: artifacts/task_7/table.csv
    ordered: true
  evaluators: []
- name: task_8
  inputs: 'Get me the following power quality data:  frequency, supply voltage magnitude
    across the three phases, voltage unbalances between the phases and total voltage
    distortion across the three phases; from all EV-charging stations for 01.03.2025,
    12:00 - 12:05 in ascending order of time.'
  metadata:
    case_id: cb7c7341-37ed-42b0-b028-c238ecd9d36f
    query_code: "SELECT *\nFROM (\n    SELECT device_name, timestamp, freq, ul1v,\
      \ ul2v, ul3v, u12v, u23v, u31v, tdul1, tdul2, tdul3\n    FROM analytics.bronze.power_quality_measurements_procem\n\
      \    WHERE device_name == 'KampusareenaEVCharging'\n\n    UNION ALL\n\n    SELECT\
      \ device_id, timestamp, fhz, ul1v, ul2v, ul3v, ul12v, ul23v, ul31v, dl1, dl2,\
      \ dl3\n    FROM analytics.bronze.power_quality_measurements_electrix\n)\nWHERE\
      \ timestamp >= TIMESTAMP '2025-03-01T12:00:00'\nAND timestamp < TIMESTAMP '2025-03-01T12:05:00'\n\
      ORDER BY timestamp"
    category: data discovery
  expected_output:
  - table_path: artifacts/task_8/table.csv
    ordered: true
  evaluators: []
evaluators: []
report_evaluators: []
