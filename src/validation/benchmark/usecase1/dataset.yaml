name: usecase1
cases:
- name: task_1
  inputs: 'Get me the following power quality data:  frequency, supply voltage magnitude
    across the three phases, voltage unbalances between the phases and total voltage
    distortion across the three phases; from the solar power plants in Marjamaki for
    01.03.2025, 12:00 - 12:05 in ascending order of time.'
  metadata:
    case_id: c9f1fe53-57f6-4152-9ffd-4a72266c9888
    query_code: "SELECT device_name, timestamp, freq, ul1v, ul2v, ul3v, u12v, u23v,\
      \ u31v, tdul1, tdul2, tdul3\nFROM analytics.bronze.power_quality_measurements_procem\n\
      WHERE (\n    device_name == 'MarjamakiSolarPowerPlant01'\n    OR device_name\
      \ == 'MarjamakiSolarPowerPlant02'\n)\nAND timestamp >= TIMESTAMP '2025-03-01T12:00:00'\n\
      AND timestamp < TIMESTAMP '2025-03-01T12:05:00'\nORDER BY timestamp"
    category: data discovery
  expected_output:
  - table_path: artifacts/task_1/table.csv
  evaluators: []
- name: task_2
  inputs: Give me the frequency and power data of device 156 for March 1, 2025 from
    12:00 PM to 12:10 PM. Provide a summary of the data.
  metadata:
    case_id: 9570482f-7145-4f59-b355-bdb5b837633e
    query_code: 'SELECT timestamp, fhz, pw

      FROM analytics.bronze.power_quality_measurements_electrix

      WHERE device_id = ''device_156''

      AND timestamp >= TIMESTAMP ''2025-03-01T12:00:00Z''

      AND timestamp < TIMESTAMP ''2025-03-01T12:10:00Z'''
    category: data discovery
  expected_output:
  - table_path: artifacts/task_2/table.csv
  - explanation: The data is provided in 1-minute intervals. During these 10 minutes,
      the frequency was stable around 50 Hz while the power decreased every minute
      from around 16.3 kW to around 14.2 kW.
  evaluators: []
evaluators: []
report_evaluators: []
