[project]
name = "secha-agent"
version = "0.1.0"
description = "AI data agent for the SECHA data platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "ggsql>=0.3.2",
    "genai-prices>=0.0.60",
    "jinja2>=3.1.6,<4",
    "logfire>=4.37.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pydantic>=2.13.4",
    "pydantic-ai>=2.12.0",
    "pydantic-evals[logfire]>=2.13.0",
    "pydantic-settings>=2.14.2",
    "pyarrow>=24.0.0",
    "pyspark==4.2.0",
    "pyspark-client==4.2.0",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.2",
    "starlette>=0.40.0,<2",
    "streamlit>=1.60.0",
    "vl-convert-python>=1.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.16.3",
    "ty>=0.0.71",
]

[tool.pytest.ini_options]
pythonpath = ["."]
